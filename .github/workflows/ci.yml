name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Make Maven wrapper executable
      run: chmod +x ./mvnw

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Display Java Version
      run: java -version

    - name: Run tests with Maven
      run: ./mvnw clean verify -B
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;NON_KEYWORDS=DAY
        SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
        SPRING_DATASOURCE_USERNAME: sa
        SPRING_DATASOURCE_PASSWORD: ''
        SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests -B

    - name: Build Docker and Push Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        image: aymenjebrane/smartCompus
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Maven Tests
        path: 'target/surefire-reports/**/*.xml'
        reporter: 'java-junit'
      continue-on-error: true

    - name: Notify on Failure
      if: failure()
      run: echo "❌ CI Pipeline Failed - Please check the logs above"

