name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smartcompus
          POSTGRES_USER: smartcompus
          POSTGRES_PASSWORD: smartcompus123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Display Java Version
      run: java -version

    - name: Run tests with Maven
      run: ./mvnw clean verify -B
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartcompus
        SPRING_DATASOURCE_USERNAME: smartcompus
        SPRING_DATASOURCE_PASSWORD: smartcompus123
        SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests -B

    - name: Build Docker and Push Image
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        image: aymenjebrane/smartCompus
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Maven Tests
        path: 'target/surefire-reports/**/*.xml'
        reporter: 'java-junit'
      continue-on-error: true

    - name: Notify on Failure
      if: failure()
      run: echo "❌ CI Pipeline Failed - Please check the logs above"

